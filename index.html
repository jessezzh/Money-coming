<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="format-detection" content="telephone=no" />
    <title>Money · 记账</title>
    <style>
      /* Money · Apple 设计语言（单文件版 v3.0 · CloudBase 云库版）
         设计原则：①仅浅色，无暗黑 ②只记支出，数字纯黑无¥无红绿
         ③玻璃只给按钮类控件（iOS 26 Liquid Glass），卡片实色扁平
         ④间距 8px 节奏，字阶 34/17/15/13
         数据：腾讯云开发 CloudBase 云库 records 集合，两人共用一个账号同步记账 */

      :root {
        color-scheme: light;

        --page: #f2f2f7;
        --card: #fff;
        --inset: rgb(118 118 128 / .1);
        --label: #1c1c1e;
        --label-secondary: rgb(60 60 67 / .6);
        --label-tertiary: rgb(60 60 67 / .3);
        --separator: rgb(60 60 67 / .16);
        --fill: rgb(118 118 128 / .12);
        --accent: #007aff;
        --red: #c0392b;
        --red-soft: rgb(224 122 108 / .14);

        /* 液态玻璃配方：高透 + 折射高光描边 + 悬浮投影 */
        --glass-bg: rgb(255 255 255 / .55);
        --glass-blur: blur(24px) saturate(180%);
        --glass-rim: inset 0 1px 0 rgb(255 255 255 / .9), inset 0 0 0 1px rgb(60 60 67 / .1);
        --glass-shadow: 0 4px 16px rgb(31 41 71 / .08), 0 1px 2px rgb(31 41 71 / .05);
        --glass-accent-bg: color-mix(in oklab, var(--accent) 80%, transparent);
        --glass-accent-shadow: inset 0 1px 0 rgb(255 255 255 / .5), 0 4px 14px rgb(0 122 255 / .25);
        --shadow-card: 0 1px 2px rgb(31 41 71 / .05);

        /* 数据序列：柱用 Apple 蓝渐变，曲线深一档蓝 */
        --bar-top: #6cb6ff;
        --bar-bottom: #2f7fe8;
        --line-stroke: #0a63c9;
        --bar-track: rgb(118 118 128 / .14);

        --radius-card: 10px;
        --radius-row: 8px;
        --radius-sheet: 12px;

        --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
        --spring: cubic-bezier(.32, .72, 0, 1);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { min-width: 320px; min-height: 100dvh; margin: 0; }
      html { background: var(--page); text-size-adjust: 100%; touch-action: manipulation; }
      body {
        background: var(--page);
        color: var(--label);
        font-family: var(--font);
        font-variant-numeric: tabular-nums lining-nums;
        -webkit-font-smoothing: antialiased;
      }
      button, input { font: inherit; color: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      svg { display: block; }
      .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

      /* 玻璃按钮基类（仅按钮类控件使用） */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-rim), var(--glass-shadow);
      }

      /* ── 导航栏：滚动收拢为居中小标题 + 毛玻璃 ── */
      .nav { position: fixed; z-index: 30; top: 0; left: 0; right: 0; margin-inline: auto; width: min(100%, 430px); padding-top: env(safe-area-inset-top); pointer-events: none; }
      .nav__bg { position: absolute; inset: 0; background: rgb(237 240 247 / .72); border-bottom: 1px solid transparent; opacity: 0; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); transition: opacity .25s ease, border-color .25s ease; }
      .nav__bar { position: relative; display: grid; place-items: end center; height: 44px; padding-bottom: 2px; }
      .nav__title { font-size: 17px; font-weight: 600; letter-spacing: -.02em; opacity: 0; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease; }
      .nav.is-condensed .nav__bg { opacity: 1; border-bottom-color: var(--separator); }
      .nav.is-condensed .nav__title { opacity: 1; transform: none; }

      .app-shell { width: min(100%, 430px); min-height: 100dvh; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 44px) 16px calc(96px + env(safe-area-inset-bottom)); }
      .large-title { margin: 0 0 16px; font-size: 34px; font-weight: 700; letter-spacing: -.021em; line-height: 1.15; }

      /* ── 周期大容器：翻页器 + 分段控件合一（消除突兀） ── */
      .period-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: var(--glass-rim), var(--glass-shadow); }
      /* 翻页器：与分段控件同款胶囊质感（箭头紧贴日期） */
      .pager { display: flex; flex: 1; align-items: center; justify-content: center; gap: 0; min-width: 0; padding: 2px; border-radius: 10px; background: var(--glass-bg); box-shadow: var(--glass-rim); }
      .pager-btn { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border: 0; background: transparent; color: var(--label-secondary); cursor: pointer; transition: opacity .16s ease; }
      .pager-btn:active { opacity: .45; }
      .pager-btn:disabled { opacity: .28; cursor: default; }
      .pager-btn .icon { width: 16px; height: 16px; stroke-width: 2.2; }
      .pager-label { min-width: 44px; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
      .period-row .segmented { flex: 1.15; }

      /* ── 分段控件：玻璃轨道 + 玻璃滑块 ── */
      .segmented { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 10px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: var(--glass-rim), var(--glass-shadow); }
      .segmented__thumb { position: absolute; z-index: 0; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--seg-count, 3)); border-radius: 8px; background: rgb(255 255 255 / .9); box-shadow: 0 1px 3px rgb(0 0 0 / .1), inset 0 1px 0 rgb(255 255 255 / .9); transform: translateX(calc(var(--seg-index, 0) * 100%)); transition: transform .3s var(--spring); }
      .segmented button { position: relative; z-index: 1; min-height: 32px; border: 0; background: transparent; color: var(--label); cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .16s ease; }
      .segmented button:active { opacity: .55; }

      /* ── 卡片与分组：实色扁平 ── */
      .card { border-radius: var(--radius-card); background: var(--card); box-shadow: var(--shadow-card); }
      .card-caption { margin: 0; padding: 16px 16px 0; color: var(--label-secondary); font-size: 13px; }
      .list-card { padding: 0; overflow: hidden; margin: 0; list-style: none; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 8px; }
      .section-title { margin: 0; padding: 0 2px 8px; color: var(--label-secondary); font-size: 13px; font-weight: 500; }
      .section-heading .section-title { padding: 0; }
      .section-action { padding: 4px 0; border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 15px; transition: opacity .16s ease; }
      .section-action:active { opacity: .45; }

      /* ── 汇总：可点击大卡（点开趋势+分类），纯黑数字 ── */
      .summary-card { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 16px; padding: 16px; border: 0; text-align: left; cursor: pointer; transition: opacity .14s ease; }
      .summary-card:active { opacity: .7; }
      .summary-main { display: block; min-width: 0; }
      .summary-label { display: block; color: var(--label-secondary); font-size: 13px; }
      .summary-value { display: block; margin-top: 6px; font-size: 34px; font-weight: 700; letter-spacing: -.021em; line-height: 1.1; font-variant-numeric: tabular-nums lining-nums; }
      .summary-chevron { width: 18px; height: 18px; flex: none; color: var(--label-tertiary); transition: transform .28s var(--spring); }
      .summary-card[aria-expanded="true"] .summary-chevron { transform: rotate(180deg); }

      /* ── 分类 / 明细行 ── */
      .content-section { margin-top: 20px; }
      .row { position: relative; display: grid; align-items: center; width: 100%; gap: 12px; padding: 12px 16px; border: 0; background: transparent; color: inherit; text-align: left; }
      .row::after { position: absolute; right: 0; bottom: 0; left: 56px; height: 1px; background: var(--separator); content: ""; }
      .row:last-child::after { content: none; }
      .entry-row::after { content: none; }
      .row:active { background: var(--fill); }
      button.row { cursor: pointer; }
      .category-row { grid-template-columns: 32px minmax(0, 1fr) auto 14px; }
      .entry-row { grid-template-columns: 32px minmax(0, 1fr) auto; cursor: pointer; }
      .sheet-delete { display: block; width: 100%; height: 44px; margin-top: 20px; border: 0; border-radius: var(--radius-card); background: var(--red-soft); color: var(--red); font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity .16s ease; }
      .sheet-delete:active { opacity: .55; }
      .sheet-delete.is-armed { background: var(--red); color: #fff; }
      .row-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--fill); color: var(--label-secondary); }
      .row-icon .icon { width: 17px; height: 17px; }
      .category-main { min-width: 0; }
      .category-name { display: block; font-size: 17px; letter-spacing: -.01em; }
      .category-track { display: block; height: 3px; margin-top: 8px; overflow: hidden; border-radius: 999px; background: var(--bar-track); }
      .category-fill { display: block; height: 100%; border-radius: inherit; background: #9a9aa0; }
      .category-value { font-size: 17px; letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums lining-nums; }
      .category-arrow { width: 14px; height: 14px; color: var(--label-tertiary); }

      .entry-main { min-width: 0; }
      .entry-title { display: block; overflow: hidden; font-size: 17px; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
      .entry-meta { display: block; margin-top: 2px; color: var(--label-secondary); font-size: 13px; }
      .entry-amount { font-size: 17px; letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums lining-nums; }
      /* 明细按日期分组（iOS 账单式）：组头灰字，空区间给一句说明而不是空白卡 */
      .group-head { padding: 14px 16px 6px; color: var(--label-secondary); font-size: 13px; font-weight: 500; }
      .group-head:first-child { padding-top: 14px; }
      .list-empty { padding: 28px 16px; color: var(--label-tertiary); font-size: 15px; text-align: center; }

      /* ── 趋势图：蓝渐变柱 + 平滑曲线双形态（图二UI） ── */
      .chart-card { padding: 16px 16px 12px; }
      .chart-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px; }
      .chart-title { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
      .chart-tag { padding: 3px 10px; border-radius: 999px; background: var(--fill); color: var(--label-secondary); font-size: 13px; }
      #trend-chart { display: block; width: 100%; height: 168px; overflow: visible; }
      /* 图表滚动容器：柱数超 6 时按固定柱距撑宽并左右滑动 */
      .chart-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .chart-scroll::-webkit-scrollbar { display: none; }
      .chart-grid { stroke: var(--separator); stroke-width: 1; }
      .chart-axis-label { fill: var(--label-tertiary); stroke: none; font-family: var(--font); font-size: 11px; }
      .chart-value-label { fill: var(--label-secondary); stroke: none; font-family: var(--font); font-size: 10px; font-weight: 500; }
      .chart-expense-bar { fill: url(#bar-gradient); stroke: none; }
      .chart-zero { fill: var(--label-tertiary); stroke: none; opacity: .5; }
      .chart-line { fill: none; stroke: var(--line-stroke); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .chart-line-area { stroke: none; opacity: .12; }
      .chart-line-dot { fill: var(--card); stroke: var(--line-stroke); stroke-width: 1.5; }
      .chart-legend { display: flex; justify-content: center; padding-top: 10px; }
      /* 柱状/曲线切换：图1分段胶囊（互斥切换） */
      .chart-legend .segmented { width: min(200px, 60%); background: var(--fill); box-shadow: none; border-radius: 999px; }
      .chart-legend .segmented__thumb { border-radius: 999px; }
      .chart-legend .segmented button { min-height: 30px; }

      /* ── 底部工具条 + 记一笔：图2质感红系药丸（居中、无白边） ── */
      .action-bar { position: fixed; z-index: 20; bottom: 0; left: 0; right: 0; margin-inline: auto; width: min(100%, 430px); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgb(242 242 247 / 0), rgb(242 242 247 / .92) 40%); pointer-events: none; }
      .primary-action { display: flex; align-items: center; justify-content: center; width: fit-content; min-width: 148px; min-height: 44px; margin: 0 auto; gap: 6px; padding: 0 22px; border: 1.5px solid rgb(224 122 108 / .55); border-radius: 999px; background: var(--red-soft); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: 0 4px 18px rgb(224 122 108 / .22); color: var(--red); cursor: pointer; pointer-events: auto; font-size: 16px; font-weight: 600; letter-spacing: -.01em; transition: opacity .14s ease, transform .14s ease; }
      .primary-action:active { opacity: .76; transform: scale(.97); }
      .primary-action .icon { width: 18px; height: 18px; stroke-width: 2.2; }

      /* ── 底部弹层：实色 + 三段式字段（标签在上、控件在下，8px 节奏） ── */
      .sheet-backdrop { position: fixed; z-index: 40; inset: 0; background: rgb(0 0 0 / .32); opacity: 0; transition: opacity .3s ease; }
      .sheet-backdrop.is-visible { opacity: 1; }
      .bottom-sheet { position: fixed; z-index: 41; bottom: 0; left: 0; right: 0; margin-inline: auto; width: min(100%, 430px); max-height: 86dvh; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; background: var(--card); transform: translateY(105%); transition: transform .42s var(--spring); }
      .bottom-sheet.is-open { transform: translateY(0); }
      .sheet-handle { width: 36px; height: 5px; margin: 0 auto 8px; border-radius: 999px; background: var(--label-tertiary); }
      .sheet-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; }
      .sheet-header h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.02em; text-align: center; }
      .sheet-close, .sheet-save { padding: 10px 4px; border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 17px; transition: opacity .16s ease; }
      .sheet-close { justify-self: start; text-align: left; }
      .sheet-save { justify-self: end; font-weight: 600; text-align: right; }
      .sheet-save.is-muted { opacity: .35; }
      .sheet-close:active, .sheet-save:active { opacity: .45; }

      .sheet-field { margin-top: 20px; }
      .field-label { margin: 0 0 8px; color: var(--label-secondary); font-size: 13px; font-weight: 500; }
      /* 金额：弹层唯一大字号，空态用 0.00 占位锚定视觉，不靠边框 */
      .amount-value { width: 100%; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--label); font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1.2; outline: 0; font-variant-numeric: tabular-nums lining-nums; }
      .amount-value::placeholder { color: var(--label-tertiary); }
      /* 文本输入（备注 / 出游）：同一套实色字段 */
      .text-field { width: 100%; min-width: 0; padding: 12px 14px; border: 1px solid transparent; border-radius: var(--radius-card); background: var(--inset); color: var(--label); font-size: 15px; outline: 0; transition: border-color .16s ease; }
      .text-field::placeholder { color: var(--label-tertiary); }
      .text-field:focus { border-color: var(--accent); }

      /* 分类 chips：等宽 4 列网格；玻璃按钮底色改用灰填充——白弹层上纯白玻璃等于看不见 */
      .category-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .category-chips button { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; height: 40px; padding: 0 6px; border: 0; border-radius: 999px; background: var(--fill); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: var(--glass-rim), var(--glass-shadow); color: var(--label); cursor: pointer; font-size: 15px; transition: opacity .16s ease; }
      .category-chips .icon { width: 15px; height: 15px; flex: none; }
      .category-chips button:active { opacity: .6; }
      .category-chips button.is-selected { background: var(--glass-accent-bg); box-shadow: var(--glass-accent-shadow); color: #fff; }
      /* 子分类：与主分类同族但弱一档（实色底 + 浅蓝选中），固定 4 列与主网格同列宽，2 项也不被拉宽 */
      .sub-row { margin-top: 8px; animation: sub-in .22s var(--spring); }
      @keyframes sub-in { from { opacity: 0; transform: translateY(-4px); } }
      .sub-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .sub-chips button { min-width: 0; height: 32px; padding: 0 4px; border: 0; border-radius: 999px; background: var(--inset); color: var(--label-secondary); cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .16s ease, color .16s ease, opacity .16s ease; }
      .sub-chips button:active { opacity: .6; }
      .sub-chips button.is-selected { background: color-mix(in oklab, var(--accent) 14%, transparent); color: var(--accent); font-weight: 500; }
      /* 日期：字段是入口按钮，日历自绘（原生 date 控件样式与整站不搭） */
      .date-field { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 45px; padding: 12px 14px; border: 0; border-radius: var(--radius-card); background: var(--inset); color: var(--label); font-size: 15px; text-align: left; cursor: pointer; transition: opacity .16s ease; }
      .date-field:active { opacity: .6; }
      .date-caret { width: 15px; height: 15px; color: var(--label-tertiary); }
      .calendar-sheet { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
      .cal-nav { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; align-items: center; padding: 2px 4px; }
      .cal-nav-label { font-size: 17px; font-weight: 600; letter-spacing: -.02em; text-align: center; }
      .cal-nav-btn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 999px; background: transparent; color: var(--accent); cursor: pointer; transition: opacity .16s ease; }
      .cal-nav-btn:active { opacity: .45; }
      .cal-nav-btn:disabled { color: var(--label-tertiary); cursor: default; opacity: 1; }
      .cal-nav-btn .icon { width: 18px; height: 18px; stroke-width: 2.2; }
      .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 0 2px; color: var(--label-secondary); font-size: 13px; text-align: center; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
      .cal-cell { display: grid; place-items: center; height: 44px; }
      .cal-day { width: 34px; height: 34px; border: 0; border-radius: 999px; background: transparent; color: var(--label); cursor: pointer; font-size: 15px; text-align: center; font-variant-numeric: tabular-nums lining-nums; transition: opacity .14s ease; }
      .cal-day:active { opacity: .55; }
      .cal-day.is-today { color: var(--accent); font-weight: 600; }
      .cal-day.is-selected { background: var(--accent); color: #fff; font-weight: 600; }

      .manager-sheet { min-height: 340px; }
      .manager-list { margin-top: 12px; }
      .manager-list .row { grid-template-columns: 32px minmax(0, 1fr) 14px; }
      .manager-name { font-size: 17px; letter-spacing: -.01em; }
      .manager-list .category-arrow { width: 14px; height: 14px; color: var(--label-tertiary); }
      .category-name-field { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; margin-top: 16px; padding: 12px 14px; border-radius: var(--radius-row); background: var(--inset); font-size: 17px; }
      .category-name-field input { min-width: 0; padding: 0; border: 0; background: transparent; color: var(--label); font-size: 17px; outline: 0; text-align: right; }
      .icon-picker { margin-top: 20px; }
      .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
      .icon-grid button { display: grid; place-items: center; aspect-ratio: 1; border: 1.5px solid transparent; border-radius: 50%; background: var(--fill); color: var(--label-secondary); cursor: pointer; transition: background .16s ease, border-color .16s ease, color .16s ease, opacity .16s ease; }
      .icon-grid button .icon { width: 20px; height: 20px; }
      .icon-grid button:active { opacity: .6; }
      .icon-grid button.is-selected { border-color: var(--accent); background: transparent; color: var(--accent); }

      .toast { position: fixed; z-index: 60; bottom: calc(96px + env(safe-area-inset-bottom)); left: 0; right: 0; margin-inline: auto; width: fit-content; max-width: calc(100% - 44px); padding: 11px 16px; border-radius: 999px; background: rgb(0 0 0 / .78); color: #fff; font-size: 15px; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .22s ease, transform .22s var(--spring); }
      .toast.is-visible { opacity: 1; transform: translateY(0); }

    <script>

      };
      const icon = (name) => ICONS[name] || ICONS.pin;

      /* 分类体系（Jesse 2026-10-11 拍板固定）：children=[]无子类，[]=数组=子chips，"free"=出游日期城市自由填 */
      const CATEGORIES = [
        { id: "food", icon: "food", name: "餐饮", children: ["三餐", "烟酒", "水"] },
        { id: "shopping", icon: "shopping", name: "购物", children: ["生活用品", "服装", "书本", "虚拟产品"] },
        { id: "fun", icon: "fun", name: "娱乐", children: ["电影", "服务"] },

        { id: "fixed", icon: "fixed", name: "固支", children: ["生活", "订阅"] },

      ];
      const catById = (id) => CATEGORIES.find((item) => item.id === id) || CATEGORIES[0];

      /* v3.0：演示基线（PERIODS/ALL_DATA/随机历史页）已全部删除，
         expense、amounts、chart、entries 一律从 state.records 按周期派生 */

      const PERIOD_ORDER = ["week", "month", "year", "all"];
      const CHEVRON = '<svg class="icon category-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>';

      const state = {
        records: [], // 云库 records 集合全部记录（按 createdAt 降序）
        period: "month",
        page: { week: 0, month: 0, year: 0, all: 0 }, // 0=本期，1=上一期，…（各 tab 独立记页；全部不翻页）
        selectedCategoryId: "food",
        selectedSub: "", // 子分类 chips 选中项
        subByCat: {}, // 各分类各自记住子分类选择，切走再切回不丢（与出游文本保留同口径）
        travelText: "", // 出游的补充文本（独立保存，防重渲染丢字）
        payer: "我", // 记账人（我 / TA）
        saving: false, // 云库写入中，防重复提交

        subOpen: false, // 子 chips 行展开态
        selectedIcon: "food",
        editingCategoryId: null,
        editingEntryId: null, // 非空=编辑明细中的某笔（云库 _id）
        activeSheet: null,
        chartMode: "bars", // 柱状/曲线互斥切换
      };

      const round2 = (value) => Math.round(value * 100) / 100;

      /* 日期：状态存 ISO；记一笔字段永远显示完整日期，明细分组保留自然语言。 */
      const isoOf = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const todayISO = () => isoOf(new Date());
      function fullDateLabel(iso) {
        const [year, month, day] = iso.split("-").map(Number);
        return `${year} 年 ${month} 月 ${day} 日`;
      }
      function dateLabel(iso) {
        const now = new Date();
        if (!iso || iso === todayISO()) return "今天"; // 与演示数据同口径，避免今天既写「刚刚」又写「今天」
        if (iso === isoOf(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1))) return "昨天";
        const [year, month, day] = iso.split("-").map(Number);
        const sameYear = year === now.getFullYear();
        return `${sameYear ? "" : `${year} 年 `}${month} 月 ${day} 日`;
      }
      /* ── CloudBase 云库数据层（records 集合） ── */
      const ENV_ID = "moneycoming-d7gm9tzbwd423d91c";
      const CLOUD = { app: null, auth: null, db: null };
      function initCloud() {
        if (typeof window.cloudbase === "undefined") return false;
        try {
          CLOUD.app = window.cloudbase.init({ env: ENV_ID });
          CLOUD.auth = CLOUD.app.auth();
          CLOUD.db = CLOUD.app.database();
          return true;
        } catch (error) {
          return false;
        }
      }
      const recordsCol = () => CLOUD.db.collection("records");
      const sortRecords = () => state.records.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      const findRecord = (id) => state.records.find((record) => record._id === id);
      let lastSyncAt = 0; // 最近一次成功拉取时间（visibilitychange 重拉节流 10 秒）
      /* 启动 / 登录后 / 窗口重新可见（节流 10 秒）时重拉；失败保留上次数据 */
      async function loadRecords() {
        try {
          const res = await recordsCol().where({}).limit(1000).get();
          const rows = (res && res.result && res.result.data) || (res && res.data) || [];
          state.records = rows.slice();
          sortRecords();
          lastSyncAt = Date.now();
          render();
        } catch (error) {
          showToast("同步失败，请检查网络后重试");
        }
      }

      /* 周期区间：记录归属的唯一依据。年/全部的明细口径沿用 v2.0 拍板的「近30天」 */
      function periodRange(period, page) {
        const now = new Date();
        if (period === "week") {
          const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) - page * 7);
          return [isoOf(monday), isoOf(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6))];
        }
        if (period === "month") {
          const first = new Date(now.getFullYear(), now.getMonth() - page, 1);
          return [isoOf(first), isoOf(new Date(first.getFullYear(), first.getMonth() + 1, 0))];
        }
        if (period === "year") {
          const year = now.getFullYear() - page;
          return [`${year}-01-01`, `${year}-12-31`];
        }
        return ["0000-01-01", "9999-12-31"];
      }
      /* 明细口径：年/全部的本期=近30天（v2.0 拍板）；翻页到历史年时给该年全部，避免翻到旧年仍显示近30天 */
      function entriesRange(period, page) {
        if (page === 0 && (period === "year" || period === "all")) {
          const now = new Date();
          return [isoOf(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29)), todayISO()];
        }
        return periodRange(period, page);
      }
      const inRange = (iso, [start, end]) => iso >= start && iso <= end;
      /* 明细：区间内记录按 createdAt 降序（最新在上） */
      function entriesFor(period, page) {
        const range = entriesRange(period, page);
        return state.records.filter((record) => inRange(record.date, range));
      }
      /* 保存后跳到能看见这笔的视图：当前视图已含则不动，否则就近落到包含该日期的周/月页 */
      function viewForDate(iso) {
        if (inRange(iso, periodRange("week", 0))) return { period: "week", page: 0 };
        const now = new Date();
        const [year, month] = iso.split("-").map(Number);
        const monthsBack = (now.getFullYear() - year) * 12 + (now.getMonth() + 1 - month);
        return { period: "month", page: monthsBack };
      }

      /* 图表序列：全部从 state.records 按周期派生
         week=自然周一~周日 7 根（一~日）；month=每天一根（labels 只标 1/5/10/15/20/25/末日）；
         year=12 根（1月~12月）；all=按年聚合（labels 裸年份，>6 根走 scrollMode） */
      function chartData(period, page) {
        const now = new Date();
        const inPeriod = state.records.filter((record) => inRange(record.date, periodRange(period, page)));
        const sumOf = (rows) => round2(rows.reduce((total, record) => total + record.amount, 0));
        if (period === "week") {
          const [start] = periodRange(period, page);
          const [sy, sm, sd] = start.split("-").map(Number);
          const monday = new Date(sy, sm - 1, sd);
          const labels = ["一", "二", "三", "四", "五", "六", "日"];
          const expense = labels.map((_, index) => {
            const iso = isoOf(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + index));
            return sumOf(inPeriod.filter((record) => record.date === iso));
          });
          return { labels, expense };
        }
        if (period === "month") {
          const first = new Date(now.getFullYear(), now.getMonth() - page, 1);
          const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
          const marked = [1, 5, 10, 15, 20, 25, days];
          const labels = [];
          const expense = [];
          for (let day = 1; day <= days; day += 1) {
            const iso = `${first.getFullYear()}-${String(first.getMonth() + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            labels.push(marked.includes(day) ? String(day) : "");
            expense.push(sumOf(inPeriod.filter((record) => record.date === iso)));
          }
          return { labels, expense };
        }
        if (period === "year") {
          const year = now.getFullYear() - page;
          const labels = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
          const expense = labels.map((_, index) => {
            const month = String(index + 1).padStart(2, "0");
            return sumOf(inPeriod.filter((record) => record.date.startsWith(`${year}-${month}`)));
          });
          return { labels, expense };
        }
        const years = [...new Set(state.records.map((record) => Number(String(record.date).slice(0, 4))).filter(Boolean))];
        const list = [];
        if (years.length) for (let year = Math.min(...years); year <= Math.max(...years); year += 1) list.push(year);
        else list.push(now.getFullYear());
        return {
          labels: list.map((year) => String(year)),
          expense: list.map((year) => sumOf(inPeriod.filter((record) => record.date.startsWith(String(year))))),
        };
      }

      function periodLabel(period, page) {
        if (period === "week") {
          if (page === 0) return "本周";
          if (page === -1) return "下周";
          if (page < 0) return `${Math.abs(page)}周后`;
          if (page === 1) return "上周";
          return `${page}周前`;
        }
        const now = new Date();
        if (period === "month") {
          return `${new Date(now.getFullYear(), now.getMonth() - page, 1).getMonth() + 1}月`;
        }
        return `${now.getFullYear() - page}`; // 年份裸数字：2026 / 2025
      }

      /* 汇总标题：年份带年字（2026年支出），全部写全部支出 */
      function summaryLabel() {
        if (state.period === "all") return "全部支出";
        const label = periodLabel(state.period, state.page[state.period]);
        return state.period === "year" ? `${label}年支出` : `${label}支出`;
      }

      const number = new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const plain = (value) => number.format(value);
      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => [...document.querySelectorAll(selector)];
      const categoryList = $("#category-list");
      const entryList = $("#entry-list");
      const chart = $("#trend-chart");
      const trendPanel = $("#trend-panel");
      const toast = $("#toast");
      const backdrop = $("#sheet-backdrop");
      const nav = $("#nav");
      const sheets = $$(".bottom-sheet");
      let toastTimer;

      /* 视图数据 = state.records 按周期派生（汇总/分类/图表用 periodRange，明细用 entriesRange） */
      function currentData() {
        const period = state.period;
        const page = state.page[period];
        const rows = state.records.filter((record) => inRange(record.date, periodRange(period, page)));
        const amounts = {};
        rows.forEach((record) => { amounts[record.category] = round2((amounts[record.category] ?? 0) + record.amount); });
        return {
          expense: round2(rows.reduce((sum, record) => sum + record.amount, 0)),
          amounts,
          chart: chartData(period, page),
          entries: entriesFor(period, page),
        };
      }

      function categoryRows(amounts) {
        return CATEGORIES.map((item) => ({ ...item, amount: amounts[item.id] ?? 0 }));
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2000);
      }

      function moveThumb(container, order, value) {
        container.style.setProperty("--seg-count", order.length);
        container.style.setProperty("--seg-index", Math.max(order.indexOf(value), 0));
      }

      function openSheet(sheetId, focusSelector) {
        closeSheet({ immediate: true });
        const sheet = $(sheetId);
        state.activeSheet = sheetId;
        backdrop.hidden = false;
        requestAnimationFrame(() => {
          if (state.activeSheet !== sheetId) return; // 期间被别的弹层接管，补帧不再把旧弹层顶回来
          backdrop.classList.add("is-visible");
          sheet.classList.add("is-open");
        });
        sheet.setAttribute("aria-hidden", "false");
        if (focusSelector) window.setTimeout(() => $(focusSelector)?.focus(), 260);
      }

      function closeSheet({ immediate = false } = {}) {
        sheets.forEach((sheet) => {
          sheet.classList.remove("is-open");
          sheet.setAttribute("aria-hidden", "true");
        });
        backdrop.classList.remove("is-visible");
        state.activeSheet = null;
        const hide = () => { backdrop.hidden = true; };
        if (immediate) hide(); else window.setTimeout(hide, 320);
      }

      function renderCategoryChips() {
        const chipBox = $("#category-chips");
        chipBox.innerHTML = CATEGORIES.map((category) => `
          <button type="button" data-category-id="${escapeHtml(category.id)}" aria-pressed="${String(category.id === state.selectedCategoryId)}" class="${category.id === state.selectedCategoryId ? "is-selected" : ""}">${icon(category.icon)}<span>${escapeHtml(category.name)}</span></button>
        `).join("");
        renderSubRow();
      }

      /* 子分类行：餐饮/购物点开子 chips；出游变日期+城市文本框；其余隐藏 */
      function renderSubRow() {
        const box = $("#sub-row");
        const live = $("#sub-travel-input");
        if (live) state.travelText = live.value; // 重渲染前同步已输入文本，防丢字

        } else if (Array.isArray(category.children) && category.children.length && state.subOpen) {

            <button type="button" data-sub="${escapeHtml(sub)}" aria-pressed="${String(sub === state.selectedSub)}" class="${sub === state.selectedSub ? "is-selected" : ""}">${escapeHtml(sub)}</button>

      /* 记账人胶囊：我 / TA 玻璃胶囊互斥选中 */
      function renderPayerChips() {
        $$("#payer-chips button").forEach((button) => {

      function renderCategories(amounts) {
        const rows = categoryRows(amounts);
        const max = Math.max(...rows.map((item) => item.amount), 1);
        categoryList.innerHTML = rows.map((item) => `
          <button class="row category-row" type="button" data-category-id="${escapeHtml(item.id)}" aria-label="${escapeHtml(item.name)}分类">
            <span class="row-icon" aria-hidden="true">${icon(item.icon)}</span>
            <span class="category-main"><span class="category-name">${escapeHtml(item.name)}</span><span class="category-track"><span class="category-fill" style="width:${item.amount ? Math.max(8, (item.amount / max) * 100) : 0}%"></span></span></span>
            <strong class="category-value">${plain(item.amount)}</strong>

        `).join("");
      }

      function renderManagerList() {
        const list = $("#category-manager-list");
        list.innerHTML = CATEGORIES.map((category) => `
          <button class="row manager-row" type="button" data-category-id="${escapeHtml(category.id)}" aria-label="更换${escapeHtml(category.name)}图标">
            <span class="row-icon" aria-hidden="true">${icon(category.icon)}</span>
            <span class="manager-name">${escapeHtml(category.name)}</span>
            ${CHEVRON}
          </button>
        `).join("");
      }

      function renderChart(data) {
        const baseline = 118;
        const maxExpense = Math.max(...data.expense, 1);
        /* 滚动仅作用于全部模式（年为单位）：年数 >6 固定柱距撑宽并左右滑动，≤6 自适应；周/月/年始终满宽 */
        const n = data.labels.length;
        const scrollMode = state.period === "all" && n > 6;
        const col = 52;
        const width = scrollMode ? 16 * 2 + col * n : 344;
        const step = scrollMode ? col : 312 / Math.max(n - 1, 1);
        const center = (index) => (scrollMode ? 16 + col * index + col / 2 : 16 + step * index);
        chart.setAttribute("viewBox", `0 0 ${width} 152`);
        chart.style.width = scrollMode ? `${width}px` : "100%";
        const yOf = (value) => baseline - (value ? Math.max(5, (value / maxExpense) * 88) : 4);
        const grid = [24, 71, 118].map((y) => `<line class="chart-grid" x1="16" x2="${width - 16}" y1="${y}" y2="${y}" />`).join("");

        const bars = state.chartMode === "bars" ? data.expense.map((value, index) => {
          const barW = Math.min(8, step * 0.6); // 月视图柱多：柱宽随步距自适应
          const x = center(index) - barW / 2;
          const y = yOf(value);
          return `<rect class="${value ? "chart-expense-bar" : "chart-zero"}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${(baseline - y).toFixed(1)}" rx="2" />`;
        }).join("") : "";

        const points = data.expense.map((value, index) => [center(index), yOf(value)]);
        const smooth = (pts) => pts.map((p, i) => {
          if (!i) return `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
          const prev = pts[i - 1];
          const midX = (prev[0] + p[0]) / 2;
          return `C${midX.toFixed(1)} ${prev[1].toFixed(1)}, ${midX.toFixed(1)} ${p[1].toFixed(1)}, ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
        }).join(" ");
        const path = smooth(points);
        const area = `M${points[0][0].toFixed(1)} ${baseline} ` + path.replace(/^M/, "L") + ` L${points[points.length - 1][0].toFixed(1)} ${baseline} Z`;
        const line = state.chartMode === "line"
          ? `<path class="chart-line-area" d="${area}" style="fill:var(--line-stroke)" />${data.expense.map((value, index) => (value ? `<circle class="chart-line-dot" cx="${center(index).toFixed(1)}" cy="${yOf(value).toFixed(1)}" r="2.5" />` : "")).join("")}<path class="chart-line" d="${path}" />`
          : "";

        const labels = data.labels.map((label, index) => (label ? `<text class="chart-axis-label" x="${center(index).toFixed(1)}" y="147" text-anchor="middle">${escapeHtml(label)}</text>` : "")).join("");
        /* 数值标注：柱状压柱顶上方 6px，曲线压点上方 8px；点数 ≤12 全点标数值，>12 只标最大值点（防重叠） */
        const chartNum = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 });
        const valueOffset = state.chartMode === "bars" ? 6 : 8;
        const showEvery = data.expense.length <= 12;
        const maxIndex = data.expense.indexOf(Math.max(...data.expense));
        const values = data.expense.map((value, index) => {
          if (!showEvery && index !== maxIndex) return "";
          return `<text class="chart-value-label" x="${center(index).toFixed(1)}" y="${(yOf(value) - valueOffset).toFixed(1)}" text-anchor="middle">${chartNum.format(value)}</text>`;
        }).join("");
        chart.innerHTML = `<title id="chart-description">当期支出趋势，柱状与曲线为同一支出序列</title><defs><linearGradient id="bar-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bar-top)" /><stop offset="1" style="stop-color:var(--bar-bottom)" /></linearGradient></defs>${grid}${bars}${line}${values}${labels}`;
        const scrollBox = $("#chart-scroll");
        const stickRight = () => { scrollBox.scrollLeft = scrollBox.scrollWidth; };
        stickRight(); // 滚动模式停在最新年份
        requestAnimationFrame(stickRight); // 布局落定后补一发，防首帧不生效
      }

      /* 明细 meta：{记账人} · {今天|昨天|M 月 D 日} · {分类名}[ · {子分类}] */
      function entryMeta(record) {
        const category = catById(record.category);
        return [record.payer || "我", dateLabel(record.date), category.name, record.sub || ""].filter(Boolean).join(" · ");
      }

      function renderEntries(entries) {
        if (!entries.length) {
          entryList.innerHTML = '<li class="list-empty">本期还没有记账</li>';
          return;
        }
        entryList.innerHTML = entries.map((entry) => {
          const category = catById(entry.category);

          return `
          <li class="row entry-row" data-entry-id="${escapeHtml(entry._id)}" role="button" tabindex="0" aria-label="编辑${escapeHtml(title)}">
            <span class="row-icon" aria-hidden="true">${icon(category.icon)}</span>
            <span class="entry-main"><span class="entry-title">${escapeHtml(title)}</span><span class="entry-meta">${escapeHtml(entryMeta(entry))}</span></span>
            <strong class="entry-amount">${plain(entry.amount)}</strong>
          </li>`;
        }).join("");
      }

      function render() {
        const data = currentData();
        const isAll = state.period === "all";
        const isYear = state.period === "year";
        $("#period-label").textContent = isAll ? "全部" : periodLabel(state.period, state.page[state.period]);
        $("#summary-label").textContent = summaryLabel();
        $("#expense-value").textContent = plain(data.expense);
        $("#period-prev").disabled = isAll;
        $("#period-next").disabled = isAll;
        /* 明细口径：周=本周全部单笔，月=当月，年/全部的本期=近30天，历史年=该年全部 */
        const near30 = state.page[state.period] === 0 && (isYear || isAll);
        $("#detail-title").textContent = near30 ? "近30天明细" : "明细";
        renderCategories(data.amounts);
        renderCategoryChips();
        renderManagerList();
        renderEntries(data.entries);
        renderChart(data.chart);
        $$('[data-period]').forEach((button) => {
          button.setAttribute("aria-selected", String(button.dataset.period === state.period));
        });
        moveThumb($("#period-switch"), PERIOD_ORDER, state.period);
      }

      function openCategoryEditor(categoryId = null) {
        const category = catById(categoryId);
        state.editingCategoryId = category.id;
        state.selectedIcon = category.icon;
        $("#category-editor-title").textContent = `${category.name} · 图标`;
        $$("#icon-grid button").forEach((button) => {
          button.classList.toggle("is-selected", button.dataset.icon === state.selectedIcon);
          button.innerHTML = icon(button.dataset.icon);
        });

      }

      function saveCategory() {
        const category = catById(state.editingCategoryId);
        category.icon = state.selectedIcon;
        render();
        openSheet("#category-manager-sheet");
        showToast("图标已更换");
      }

      /* 金额输入：只留数字与一个小数点、小数最多两位、去前导零；失焦补成两位 */
      function sanitizeAmount(value) {
        let text = value.replace(/[^\d.]/g, "");
        const dot = text.indexOf(".");
        if (dot > -1) text = `${text.slice(0, dot + 1)}${text.slice(dot + 1).replace(/\./g, "").slice(0, 2)}`;
        return text.replace(/^0+(?=\d)/, "");
      }

      function readRecordForm() {
        const raw = $("#amount-input").value.trim();
        if (!/^\d{1,7}(\.\d{1,2})?$/.test(raw) || Number(raw) <= 0) {
          showToast(raw ? "金额格式不对，最多两位小数" : "请输入大于 0 的金额");
          $("#amount-input").focus();
          return null;
        }
        const iso = state.recordDate || todayISO();
        const category = catById(state.selectedCategoryId);
        const note = $("#note-input").value.trim() || category.name;
        const sub = category.children === "free" ? ($("#sub-travel-input")?.value.trim() || state.travelText.trim() || "") : (state.selectedSub || "");
        return { amount: round2(Number(raw)), category, note, sub, iso, payer: state.payer || "我" };
      }

      /* 日期弹层：自绘月历，过去与未来日期均可选；选完回到记一笔表单。 */
      function syncDateField() {
        $("#date-value").textContent = fullDateLabel(state.recordDate);
      }
      function renderCalendar() {
        const [year, month] = state.calMonth.split("-").map(Number);
        const today = todayISO();
        $("#cal-label").textContent = `${year} 年 ${month} 月`;
        const lead = (new Date(year, month - 1, 1).getDay() + 6) % 7; // 周一起排
        const days = new Date(year, month, 0).getDate();
        let html = '<span class="cal-cell"></span>'.repeat(lead);
        for (let day = 1; day <= days; day += 1) {
          const iso = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const cls = ["cal-day"];
          if (iso === state.recordDate) cls.push("is-selected");
          else if (iso === today) cls.push("is-today");
          html += `<span class="cal-cell"><button type="button" class="${cls.join(" ")}" data-date="${iso}" role="gridcell" aria-label="${year} 年 ${month} 月 ${day} 日">${day}</button></span>`;
        }
        $("#cal-grid").innerHTML = html;
      }
      function shiftMonth(step) {
        const [year, month] = state.calMonth.split("-").map(Number);
        const date = new Date(year, month - 1 + step, 1);
        state.calMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
        renderCalendar();
      }
      function openDateSheet() {
        state.calMonth = (state.recordDate || todayISO()).slice(0, 7);
        renderCalendar();
        openSheet("#date-sheet");
      }
      function pickDate(iso) {
        state.recordDate = iso;
        syncDateField();
        openSheet("#record-sheet");
      }
      /* 关闭当前最上层：日历回到表单，表单才真正收起 */
      function closeTopSheet() {
        if (state.activeSheet === "#date-sheet") openSheet("#record-sheet");
        else closeSheet();
      }
      /* 完成按钮：金额无效时弱显（仍可点，点击给 toast 说明原因，不静默吞掉） */
      function syncSaveState() {
        const raw = $("#amount-input").value.trim();
        $("#save-record").classList.toggle("is-muted", !(/^\d{1,7}(\.\d{1,2})?$/.test(raw) && Number(raw) > 0));
      }

      /* 新增 / 编辑一律先写云库，成功后才改本地 state.records 并 render */
      async function saveRecord() {
        const form = readRecordForm();
        if (!form) return;
        if (state.saving) return;
        const { amount, category, note, sub, iso, payer } = form;
        const wasEdit = state.editingEntryId != null;
        state.saving = true;
        try {
          if (wasEdit) {
            const patch = { amount, category: category.id, sub, title: note, date: iso, payer, updatedAt: Date.now() };
            await recordsCol().doc(state.editingEntryId).update(patch);
            const hit = findRecord(state.editingEntryId);
            if (hit) Object.assign(hit, patch);
            state.editingEntryId = null;
          } else {
            const now = Date.now();
            const doc = { amount, category: category.id, sub, title: note, date: iso, payer, createdAt: now, updatedAt: now };
            const res = await recordsCol().add(doc);
            const id = (res && (res.id || (res.result && res.result.id))) || "";
            state.records.unshift({ ...doc, _id: id });
            sortRecords();
          }
        } catch (error) {
          state.saving = false;
          showToast("保存失败，请重试");
          return;
        }
        state.saving = false;
        /* 当前视图看不见这笔时才跳视图，跳到包含该日期的周/月/年/全部 */
        if (!inRange(iso, entriesRange(state.period, state.page[state.period]))) {
          const view = viewForDate(iso);
          state.period = view.period;
          state.page[view.period] = view.page;
        }
        render();
        closeSheet();
        showToast(wasEdit ? "已保存修改" : "已记下这笔支出");
      }

      /* 记一笔弹层两种打开方式：新建（空表单）/ 编辑（预填+删除） */
      function openRecordSheet() {
        state.editingEntryId = null;
        $("#sub-row").innerHTML = "";
        $("#sub-row").hidden = true;
        state.selectedCategoryId = "food";
        state.selectedSub = "";
        state.travelText = "";
        state.subByCat = {};
        state.subOpen = true;
        state.payer = "我";
        $("#sheet-title").textContent = "记一笔";
        $("#save-record").textContent = "完成";
        $("#amount-input").value = "";
        state.recordDate = todayISO();
        syncDateField();
        $("#note-input").value = "";
        const del = $("#delete-record");
        del.hidden = true;
        del.classList.remove("is-armed");
        del.textContent = "删除这笔";
        renderCategoryChips();
        renderPayerChips();
        syncSaveState();
        openSheet("#record-sheet", "#amount-input");
      }

      function openEntryEditor(entryId) {
        const hit = findRecord(entryId);
        if (!hit) return;
        state.editingEntryId = entryId;
        $("#sub-row").innerHTML = "";
        $("#sub-row").hidden = true;
        state.selectedCategoryId = hit.category;
        const category = catById(hit.category);
        if (category.children === "free") {
          state.travelText = hit.sub || "";
          state.selectedSub = "";
          state.subOpen = false;
        } else {
          state.selectedSub = hit.sub || "";
          state.travelText = "";
          state.subOpen = Array.isArray(category.children) && category.children.length > 0;
        }
        state.payer = hit.payer || "我";
        $("#sheet-title").textContent = "编辑账目";
        $("#save-record").textContent = "保存";
        $("#amount-input").value = Number(hit.amount).toFixed(2);
        state.recordDate = hit.date;
        syncDateField();
        $("#note-input").value = hit.title || category.name;
        const del = $("#delete-record");
        del.hidden = false;
        del.classList.remove("is-armed");
        del.textContent = "删除这笔";
        renderCategoryChips();
        renderPayerChips();
        syncSaveState();
        openSheet("#record-sheet", "#amount-input");
      }

      $$("[data-period]").forEach((button) => button.addEventListener("click", () => {
        state.period = button.dataset.period;
        render();
      }));

      $("#period-prev").addEventListener("click", () => {
        state.page[state.period] += 1;
        render();
      });
      $("#period-next").addEventListener("click", () => {
        state.page[state.period] -= 1;
        render();
      });

      /* 汇总卡就地展开：支出趋势 + 分类 */
      function setExpand(open) {
        $("#expand-area").hidden = !open;
        $("#summary-card").setAttribute("aria-expanded", String(open));
      }
      function collapseExpand() {
        setExpand(false);
      }
      $("#summary-card").addEventListener("click", () => {
        setExpand($("#expand-area").hidden);
      });

      $("#open-sheet").addEventListener("click", openRecordSheet);
      $("#date-field").addEventListener("click", openDateSheet);
      $("#date-cancel").addEventListener("click", () => openSheet("#record-sheet"));
      $("#cal-prev").addEventListener("click", () => shiftMonth(-1));
      $("#cal-next").addEventListener("click", () => shiftMonth(1));
      $("#cal-grid").addEventListener("click", (event) => {
        const cell = event.target.closest("[data-date]");
        if (cell && !cell.disabled) pickDate(cell.dataset.date);
      });
      $("#open-category-manager").addEventListener("click", () => openSheet("#category-manager-sheet"));
      $("#save-record").addEventListener("click", saveRecord);
      $("#amount-input").addEventListener("input", (event) => {
        const cleaned = sanitizeAmount(event.target.value);
        if (cleaned !== event.target.value) event.target.value = cleaned;
        syncSaveState();
      });
      $("#amount-input").addEventListener("blur", (event) => {
        if (/^\d{1,7}(\.\d{1,2})?$/.test(event.target.value) && Number(event.target.value) > 0) event.target.value = Number(event.target.value).toFixed(2);
      });
      /* enterkeyhint=done 落地：金额/备注上按回车即入账 */
      ["#amount-input", "#note-input"].forEach((selector) => $(selector).addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        saveRecord();
      }));
      $("#save-category").addEventListener("click", saveCategory);
      $("#back-to-category-manager").addEventListener("click", () => openSheet("#category-manager-sheet"));
      $$("[data-close-sheet]").forEach((button) => button.addEventListener("click", () => closeSheet()));
      backdrop.addEventListener("click", closeTopSheet);

      categoryList.addEventListener("click", (event) => {
        const row = event.target.closest("[data-category-id]");
        if (row) openCategoryEditor(row.dataset.categoryId);
      });

      $("#category-manager-list").addEventListener("click", (event) => {
        const row = event.target.closest("[data-category-id]");
        if (row) openCategoryEditor(row.dataset.categoryId);
      });

      $("#category-chips").addEventListener("click", (event) => {
        const chip = event.target.closest("[data-category-id]");
        if (!chip) return;
        const id = chip.dataset.categoryId;
        const category = catById(id);
        if (id === state.selectedCategoryId) {
          if (Array.isArray(category.children) && category.children.length) state.subOpen = !state.subOpen; // 再点同一分类：收/开子行（出游重点击保留已输入文本）
        } else {
          state.selectedCategoryId = id;
          state.selectedSub = state.subByCat[id] || "";
          state.subOpen = Array.isArray(category.children) && category.children.length > 0;
        }
        renderCategoryChips();
      });

      $("#sub-row").addEventListener("click", (event) => {
        const subButton = event.target.closest("[data-sub]");
        if (!subButton) return;
        state.selectedSub = state.selectedSub === subButton.dataset.sub ? "" : subButton.dataset.sub;
        state.subByCat[state.selectedCategoryId] = state.selectedSub;
        renderSubRow();
      });
      $("#sub-row").addEventListener("input", (event) => {
        if (event.target.id === "sub-travel-input") state.travelText = event.target.value; // 输入即时入 state
      });

      entryList.addEventListener("click", (event) => {
        const row = event.target.closest("[data-entry-id]");
        if (row) openEntryEditor(row.dataset.entryId);
      });

      /* 记账人：我 / TA 胶囊互斥 */
      $("#payer-chips").addEventListener("click", (event) => {
        const chip = event.target.closest("[data-payer]");
        if (!chip) return;
        state.payer = chip.dataset.payer;
        renderPayerChips();
      });

      /* 删除账目：两击确认防误触（第一次武装，第二次删云库，成功后改本地并跨周期同步） */
      $("#delete-record").addEventListener("click", async () => {
        const btn = $("#delete-record");
        const id = state.editingEntryId;
        if (id == null) return;
        if (!btn.classList.contains("is-armed")) {
          btn.classList.add("is-armed");
          btn.textContent = "确认删除这笔？再点一次";
          return;
        }
        if (state.saving) return;
        state.saving = true;
        try {
          await recordsCol().doc(id).remove();
        } catch (error) {
          state.saving = false;
          showToast("删除失败，请重试");
          return;
        }
        state.saving = false;
        state.records = state.records.filter((record) => record._id !== id);
        state.editingEntryId = null;
        render();
        closeSheet();
        showToast("已删除这笔支出");
      });

      $("#icon-grid").addEventListener("click", (event) => {
        const iconButton = event.target.closest("[data-icon]");
        if (!iconButton) return;
        state.selectedIcon = iconButton.dataset.icon;
        $$("#icon-grid button").forEach((button) => button.classList.toggle("is-selected", button === iconButton));
      });

      $$("[data-chart-mode]").forEach((button) => button.addEventListener("click", () => {
        state.chartMode = button.dataset.chartMode;
        $$('[data-chart-mode]').forEach((candidate) => {
          candidate.setAttribute("aria-selected", String(candidate === button));
        });
        moveThumb($("#chart-switch"), ["bars", "line"], state.chartMode);
        renderChart(currentData().chart);
      }));

      let navTicking = false;
      const syncNav = () => {
        nav.classList.toggle("is-condensed", window.scrollY > 28);
        navTicking = false;
      };
      window.addEventListener("scroll", () => {
        if (navTicking) return;
        navTicking = true;
        requestAnimationFrame(syncNav);
      }, { passive: true });

      document.addEventListener("keydown", (event) => { if (event.key === "Escape" && state.activeSheet) closeTopSheet(); });

      moveThumb($("#chart-switch"), ["bars", "line"], state.chartMode);
      moveThumb($("#period-switch"), PERIOD_ORDER, state.period);
      syncNav();
      render();

      /* ── 登录（CloudBase 用户名密码）：已登录直接进 App 拉数据，否则显示登录页 ── */
      function showLogin(errorText = "") {
        $("#login-error").textContent = errorText;
        $("#login-screen").hidden = false;
      }
      const hideLogin = () => { $("#login-screen").hidden = true; };
      let loggingIn = false;

      $("#login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (loggingIn) return;
        const username = $("#login-username").value.trim();
        const password = $("#login-password").value;
        if (!username || !password) {
          $("#login-error").textContent = "请输入用户名和密码";
          return;
        }
        loggingIn = true;
        const btn = $("#login-submit");
        btn.disabled = true;
        btn.textContent = "登录中…";
        try {
          await CLOUD.auth.signInWithUsernameAndPassword(username, password);
          hideLogin();
          $("#login-error").textContent = "";
          await loadRecords();
        } catch (error) {
          $("#login-error").textContent = "登录失败，请检查用户名密码（并确认控制台已开启『用户名密码』登录方式）";
        } finally {
          loggingIn = false;
          btn.disabled = false;
          btn.textContent = "登录";
        }
      });

      $("#logout-btn").addEventListener("click", async () => {
        try { await CLOUD.auth.signOut(); } catch (error) { /* 退出失败也退回登录页 */ }
        state.records = [];
        state.editingEntryId = null;
        render();
        showLogin();
      });

      /* 窗口重新可见时重拉云端数据（节流 10 秒） */
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") return;
        if (!CLOUD.db) return;
        if (Date.now() - lastSyncAt < 10000) return;
        loadRecords();
      });

      async function boot() {
        if (!initCloud()) {
          $("#login-submit").disabled = true;
          showLogin("云服务组件加载失败，请检查网络后刷新页面");
          return;
        }
        let loginState = null;
        try { loginState = await Promise.resolve(CLOUD.auth.hasLoginState()); } catch (error) { loginState = null; }
        if (loginState) {
          hideLogin();
          loadRecords();
        } else {
          showLogin();
        }
      }
      boot();
    </script>
  </body>
</html>
